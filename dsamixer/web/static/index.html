<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsaMixer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c66e4'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'%3Ed%3C/text%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint. ?theme=dark|light overrides for this page load only.
    (function () {
      var t = null;
      try { t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("theme"); } catch (e) {}
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/views.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/today" aria-label="dsaMixer home"><span class="logo" aria-hidden="true">d</span><span class="wordmark">dsa<span class="accent">Mixer</span></span></a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/today" data-route="today">Today</a>
      <a href="#/week" data-route="week">Week</a>
      <a href="#/sprint" data-route="sprint">Sprint</a>
      <a href="#/stats" data-route="stats">Stats</a>
      <a href="#/contests" data-route="contests">Contests</a>
      <a href="#/questions" data-route="questions">Questions</a>
      <a href="#/ai" data-route="ai">AI course</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
    <div class="topbar-right">
      <a id="timerInd" class="timer-ind" href="#/today" hidden><span class="dot" aria-hidden="true"></span><span id="timerClock"></span><span id="timerTitle" class="timer-title"></span></a>
      <span id="streak" class="streak" data-tip="Consecutive days with at least one card done"><span id="streakIcon" aria-hidden="true"></span><b id="streakN">–</b> <span id="streakWord">days</span></span>
      <button class="btn icon ghost" id="themeBtn" aria-label="Toggle dark mode" data-tip="Toggle theme"></button>
      <button class="btn icon ghost" id="helpBtn" aria-label="Keyboard shortcuts" data-tip="Keyboard shortcuts  ?"></button>
    </div>
  </header>
  <main id="view"></main>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
